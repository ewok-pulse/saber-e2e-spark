#   Namespace:    endor-solutions-ypulse.github-ci.saber-e2e
#   Auth:         GitHub OIDC (keyless)
#   PR behavior:  comment on PR (non-blocking)
#   PR scan mode: quick
#
# Regenerate this file with `saber scan repo` (point at this repo's path).
# Hand-edits will be overwritten on the next regeneration.
# ─────────────────────────────────────────────────────────────────
#
# Saber split one or more scan units to fit standard runner memory:
#   • java: 8 shards (sql, common, connector, resource-managers, udf, assembly, core, other)
#     Saber split the java scan into multiple jobs because this repo has 47
#     java root manifests — a single full-reachability scan exceeds the
#     ubuntu-latest runner memory budget. Each shard scans one top-level
#     subtree with full reachability preserved.
#
name: Endor Labs Scan
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      java-sql: ${{ steps.filter.outputs.java-sql }}
      java-common: ${{ steps.filter.outputs.java-common }}
      java-connector: ${{ steps.filter.outputs.java-connector }}
      java-resource-managers: ${{ steps.filter.outputs.java-resource-managers }}
      java-udf: ${{ steps.filter.outputs.java-udf }}
      java-assembly: ${{ steps.filter.outputs.java-assembly }}
      java-core: ${{ steps.filter.outputs.java-core }}
      java-other: ${{ steps.filter.outputs.java-other }}
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      python: ${{ steps.filter.outputs.python }}
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            java-sql:
              - sql/**/'**/pom.xml'
              - sql/**/'**/build.gradle'
              - sql/**/'**/build.gradle.kts'
              - sql/**/'**/*.java'
            java-common:
              - common/**/'**/pom.xml'
              - common/**/'**/build.gradle'
              - common/**/'**/build.gradle.kts'
              - common/**/'**/*.java'
            java-connector:
              - connector/**/'**/pom.xml'
              - connector/**/'**/build.gradle'
              - connector/**/'**/build.gradle.kts'
              - connector/**/'**/*.java'
            java-resource-managers:
              - resource-managers/**/'**/pom.xml'
              - resource-managers/**/'**/build.gradle'
              - resource-managers/**/'**/build.gradle.kts'
              - resource-managers/**/'**/*.java'
            java-udf:
              - udf/**/'**/pom.xml'
              - udf/**/'**/build.gradle'
              - udf/**/'**/build.gradle.kts'
              - udf/**/'**/*.java'
            java-assembly:
              - assembly/**/'**/pom.xml'
              - assembly/**/'**/build.gradle'
              - assembly/**/'**/build.gradle.kts'
              - assembly/**/'**/*.java'
            java-core:
              - core/**/'**/pom.xml'
              - core/**/'**/build.gradle'
              - core/**/'**/build.gradle.kts'
              - core/**/'**/*.java'
            java-other:
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/build.gradle.kts'
              - '**/*.java'
            javascript-typescript:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
            python:
              - '**/requirements.txt'
              - '**/pyproject.toml'
              - '**/poetry.lock'
              - '**/setup.py'
              - '**/setup.cfg'
              - '**/Pipfile'
              - '**/Pipfile.lock'
              - '**/pdm.lock'
              - '**/uv.lock'
              - '**/*.py'
            ruby:
              - '**/Gemfile'
              - '**/Gemfile.lock'
              - '**/*.gemspec'
              - '**/*.rb'
  scan-java-sql-pr:
    name: "PR Scan: java (sql)"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.java-sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn install -DskipTests -q
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=java --include-path=sql/** --exclude-path=connector/docker-integration-tests/** --exclude-path=resource-managers/kubernetes/integration-tests/** --quick-scan"
